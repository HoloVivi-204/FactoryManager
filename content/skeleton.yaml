schema_version: "1.1.0"

product:
  id: "FP-PRODUCT"
  code: "factory-performance"
  name_vi: "Hệ thống theo dõi hiệu suất nhà máy"
  baseline_kind: "target-and-current"
  release_id: "FP-RELEASE-MVP"

sources:
  - id: "FP-SOURCE-PRD"
    type: "product-requirements"
    path: "docs/prd.md"
    version: "2.5"
    authority: "scope-business-rules-acceptance"
  - id: "FP-SOURCE-TDD"
    type: "technical-design"
    path: "docs/technical-design.md"
    version: "1.5"
    authority: "target-architecture-contracts-testing"
  - id: "FP-SOURCE-CODE-BE"
    type: "current-implementation"
    path: "apps/backend/src/main/java/com/factory/management"
    authority: "current-backend-evidence"
  - id: "FP-SOURCE-CODE-FE"
    type: "current-implementation"
    path: "apps/frontend/src"
    authority: "current-frontend-evidence"

status_vocabulary:
  - value: "Implemented"
    meaning_vi: "Có code và bằng chứng kiểm tra phù hợp acceptance."
  - value: "Partial"
    meaning_vi: "Có một phần luồng nhưng chưa đạt toàn bộ acceptance."
  - value: "Missing"
    meaning_vi: "Chưa có implementation sử dụng được."
  - value: "Blocked"
    meaning_vi: "Chưa thể chốt vì quyết định PRD hoặc TDD còn mở."
  - value: "Out of scope"
    meaning_vi: "Không thuộc release đang xét."
  - value: "Unverified"
    meaning_vi: "Có code nhưng chưa có bằng chứng kiểm tra đủ tin cậy."

release:
  id: "FP-RELEASE-MVP"
  deployment_model: "single-tenant-one-company"
  factory_scope:
    baseline: "one-factory-per-TDD-4"
    state: "provisional"
    decision_ref: "TBD-02"
  target_priorities:
    - "Must"
  conditional_requirements:
    rule: "Guardrail chỉ thuộc acceptance khi capability tùy chọn tương ứng được bật."
    capability_ids:
      - "FP-CAP-OCR"
      - "FP-CAP-VOICE"
      - "FP-CAP-EXPORT"
      - "FP-CAP-WAREHOUSE"
      - "FP-CAP-MAINTENANCE"
  after_mvp_priorities:
    - "Should"
    - "Could"

roles:
  - id: "FP-ROLE-EXECUTIVE-MANAGER"
    name_vi: "Quản lý điều hành"
    target_scope: "company-or-assigned-factory"
  - id: "FP-ROLE-OPERATIONS-MANAGER"
    name_vi: "Quản lý vận hành"
    target_scope: "production-line-or-assigned-area"
  - id: "FP-ROLE-OPERATIONS-STAFF"
    name_vi: "Nhân viên vận hành"
    target_scope: "work-group-shift-or-assigned-machine"
  - id: "FP-ROLE-DATA-ADMIN"
    name_vi: "Quản trị dữ liệu"
    target_scope: "assigned-configuration-and-master-data"
  - id: "FP-ROLE-SYSTEM-ADMIN"
    name_vi: "Quản trị hệ thống"
    target_scope: "accounts-roles-security"
  - id: "FP-ROLE-AUDITOR"
    name_vi: "Người kiểm toán"
    target_scope: "read-only-assigned-scope"

domain_tree:
  - id: "FP-DOM-ACCESS"
    name_vi: "Xác thực và phân quyền"
    current_status: "Partial"
    target_feature_ids:
      - "FR-CFG-04"
      - "FR-NAV-01"
      - "FR-NAV-02"
      - "FR-NAV-03"
      - "FR-MDM-04"
      - "FR-SEC-01"
      - "FR-SEC-02"
      - "FR-SEC-03"
      - "FR-SEC-05"
    delivery_slice_ids:
