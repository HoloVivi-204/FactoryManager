      - "FP-SLICE-007"
    current_evidence:
      - "apps/backend/src/main/java/com/factory/management/common/config/SecurityConfig.java"
      - "apps/backend/src/main/java/com/factory/management/common/security/AuthorizationScope.java"
      - "apps/backend/src/main/java/com/factory/management/modules/auth/entity/UserDataScope.java"
    current_gap_vi: "JWT và scope đã có nhưng enum/navigation vẫn dùng tám role Current, thiếu mapping ba cấp vận hành, company context, DATA_ADMIN, AUDITOR, permission tests và còn đường cập nhật staging có thể đổi sang team ngoài scope."

  - id: "FP-DOM-COMPANY-CONFIG"
