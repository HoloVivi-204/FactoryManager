      - "apps/backend/src/main/java/com/factory/management/modules/production/service/ProductionReportStagingServiceImpl.java"
    current_gap_vi: "Staging tách official đã có; chưa có validation findings theo severity, warning override, conflict/match candidate, similarity warning hoặc reconciliation Excel–web/OCR."

  - id: "FP-DOM-CLOSING"
    name_vi: "Chốt và sửa sau chốt"
