      - "apps/backend/src/main/java/com/factory/management/modules/production/entity/ProductionReport.java"
      - "apps/backend/src/main/java/com/factory/management/modules/production/service/ProductionReportStagingServiceImpl.java"
    current_gap_vi: "Approval từng staging tạo report official nhưng chưa có closure state machine dùng được, coverage, partial close, hierarchical lock, reopen, correction workspace hoặc official versioning."

  - id: "FP-DOM-KPI"
