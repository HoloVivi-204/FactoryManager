      - "apps/frontend/src/features/dashboard/components/TeamLeaderDashboard.tsx"
    current_gap_vi: "Có dashboard tổng hợp trực tiếp từ report; thiếu chart catalog, snapshot, completeness, full filters, same-filter comparison và contributor-to-source drill-down; Reports dùng route /search/my-scope không tồn tại, còn RoleOverview có thể đổi error/missing thành 0."

