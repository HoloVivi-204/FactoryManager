      - "apps/backend/src/main/java/com/factory/management/modules/production/service/StagingReportExcelService.java"
    current_gap_vi: "Có danh mục ca và template Excel cố định; chưa có company settings, production-day rule, mapping versioned, validation thresholds, machine-state taxonomy hoặc KPI enablement configuration."

  - id: "FP-DOM-MASTER-DATA"
