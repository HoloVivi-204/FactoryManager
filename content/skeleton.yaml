      - "apps/backend/src/main/java/com/factory/management/modules/masterdata/controller/ProductController.java"
      - "apps/backend/src/main/java/com/factory/management/modules/masterdata/controller/DowntimeReasonController.java"
    current_gap_vi: "CRUD và soft deactivate đã có cho nhiều danh mục; thiếu effective dating, machine/employee-position assignment history, standard version, product-dimension reliability và import danh mục."

  - id: "FP-DOM-INGESTION"
