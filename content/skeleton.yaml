    current_gap_vi: "Có entity notification phục vụ domain khác; chưa có reminder theo deadline, close blocker, import completion hoặc escalation của Factory Performance."

  - id: "FP-DOM-AUDIT"
    name_vi: "Audit"
    current_status: "Partial"
    target_feature_ids:
      - "FR-AUD-01"
      - "FR-AUD-02"
      - "FR-AUD-03"
      - "FR-AUD-04"
