    current_gap_vi: "Form và Excel sync đã có; import hiện all-or-nothing, mapping cố định, không source batch chuẩn TDD, dataTimeClass/businessDataCode, correction provenance hoặc row-level idempotency đầy đủ."

  - id: "FP-DOM-VALIDATION"
