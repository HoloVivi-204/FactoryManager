spring:
  sql:
    init:
      mode: never

  datasource:
    url: jdbc:h2:mem:factorymanagement;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  bootstrap-admin:
    enabled: false

jwt:
  signer-key: test-jwt-signer-key-for-hs512-at-least-sixty-four-bytes-long-2026
  valid-duration: 900000
  refresh-duration: 604800000

ai:
  enabled: false
