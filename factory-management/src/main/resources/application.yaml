
server:
  port: 8080
  servlet:
    context-path: /factory-management


spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  config:
    import: optional:file:.env[.properties]

  sql:
    init:
      mode: always
      separator: "@@"

  application:
    name: factory-management

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/factorymanagement}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


api:
  prefix: /api/v1

jwt:
  signer-key: ${JWT_SIGNER_KEY:}
  valid-duration: ${JWT_VALID_DURATION:900000}
  refresh-duration: ${JWT_REFRESH_DURATION:604800000}

app:
  bootstrap-admin:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
    employee-code: ${ADMIN_EMPLOYEE_CODE:SYSTEM-ADMIN}

# Chatbot is disabled by default. Ollama runs locally and receives only
# scope-filtered Tool results; it never receives database credentials.
ai:
  enabled: ${AI_ENABLED:false}
  chat-url: ${OLLAMA_CHAT_URL:http://localhost:11434/api/chat}
  model: ${OLLAMA_MODEL:qwen3:4b}
  max-tool-calls: ${AI_MAX_TOOL_CALLS:3}
  max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1200}
  connect-timeout-seconds: ${AI_CONNECT_TIMEOUT_SECONDS:5}
  read-timeout-seconds: ${AI_READ_TIMEOUT_SECONDS:45}
  requests-per-minute: ${AI_REQUESTS_PER_MINUTE:10}
